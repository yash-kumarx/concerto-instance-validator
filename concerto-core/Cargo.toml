[package]
name = "concerto-core"
version = "0.1.0"
edition = "2021"
description = "Concerto entity validator -- GSoC 2026 POC"
license = "Apache-2.0"
repository = "https://github.com/yash-kumarx/concerto-instance-validator"
keywords = ["concerto", "validation", "accord-project", "schema"]
# checked by the msrv job in CI
rust-version = "1.88"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regress = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "validation_bench"
harness = false
