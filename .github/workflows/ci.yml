name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      # pinned, so that a new Rust release and its new clippy lints can't turn CI
      # red on their own. bump this (and Cargo.lock) on purpose instead
      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: cache rust build
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --workspace -- -D warnings

      - name: workspace tests
        run: cargo test --locked --workspace

      - name: conformance tests
        run: cargo test --locked --package concerto-conformance -- --nocapture

      - name: build cli
        run: cargo build --locked --release --package concerto-cli

      - name: build ffi
        run: cargo build --locked --release --package concerto-ffi

      - name: ffi smoke demo
        run: python3 concerto-ffi/demo/demo.py

      - name: install wasm-pack
        run: cargo install wasm-pack --locked

      - name: build wasm web
        working-directory: concerto-wasm
        run: wasm-pack build --target web

      - name: build wasm node
        working-directory: concerto-wasm
        run: wasm-pack build --target nodejs --out-dir pkg-node

      - name: node wasm smoke
        run: node concerto-wasm/scripts/node_smoke.mjs

  # builds the workspace with the oldest Rust that `rust-version` promises, so the
  # promise can't silently go stale again. `regress` uses let-chains, hence 1.88
  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: cache rust build
        uses: Swatinem/rust-cache@v2

      - name: check
        run: cargo check --locked --workspace
